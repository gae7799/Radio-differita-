<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio in differita</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    /* manipulation = niente zoom col doppio tocco; il pizzico resta attivo */
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font: 16px/1.5 system-ui, -apple-system, sans-serif;
    background: #111; color: #eee;
  }
  main { width: 100%; max-width: 380px; padding: 2rem 1.5rem; text-align: center; }

  #head { margin-bottom: 1.75rem; }
  #station { font-size: 20px; font-weight: 600; }
  #match { margin-top: .45rem; font-size: 13px; opacity: .55; line-height: 1.35; }

  #btn {
    width: 104px; height: 104px; border-radius: 50%;
    border: 2px solid #eee; background: none; color: #eee;
    font-size: 36px; line-height: 1; cursor: pointer;
  }
  #btn:disabled { opacity: .25; }

  #state { margin-top: .75rem; font-size: 14px; opacity: .75; min-height: 1.5em; }

  .pill {
    padding: .55rem 1.1rem; border-radius: 999px;
    border: 1px solid #444; background: none; color: #eee;
    font-size: 13px; letter-spacing: .04em; cursor: pointer;
  }
  .pill:active { background: #262626; }
  #resync { margin-top: .9rem; }

  section { margin-top: 2rem; border-top: 1px solid #2a2a2a; padding-top: 1.5rem; }
  .label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .5; }

  /* cronometro */
  #clockValue { font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #clockNote { font-size: 12px; opacity: .45; min-height: 1.2em; }
  #anchors { display: flex; gap: .6rem; justify-content: center; margin-top: .9rem; }

  #compare { margin-top: 1.4rem; display: flex; gap: .6rem; justify-content: center;
             align-items: center; }
  #tv {
    width: 108px; padding: .6rem; border-radius: 10px;
    border: 1px solid #444; background: #191919; color: #eee;
    font: 600 20px/1 system-ui, sans-serif; text-align: center;
    font-variant-numeric: tabular-nums; -webkit-user-select: text; user-select: text;
  }
  #verdict { margin-top: 1rem; font-size: 15px; min-height: 1.6em; }
  #apply { margin-top: .7rem; border-color: #eee; }

  /* ritardo */
  #row { display: flex; align-items: center; justify-content: center; gap: 1rem; }
  .nudge {
    width: 52px; height: 52px; border-radius: 50%; flex: none;
    border: 1px solid #444; background: none; color: #eee;
    font-size: 22px; line-height: 1; cursor: pointer;
  }
  .nudge:active { background: #262626; }
  #amount { flex: 1; }
  #secs { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #slider { width: 100%; margin-top: 1.25rem; accent-color: #eee; }
</style>
</head>
<body>
<main>
  <div id="head">
    <div id="station">&nbsp;</div>
    <div id="match" hidden></div>
  </div>

  <button id="btn" disabled>&#9654;</button>
  <div id="state">connessione…</div>
  <button class="pill" id="resync" hidden>risincronizza</button>

  <section id="clock">
    <div class="label" id="clockLabel">tempo di gioco</div>
    <div id="clockValue">–:––</div>
    <div id="clockNote"></div>

    <div id="anchors">
      <button class="pill" id="start1">via 1º tempo</button>
      <button class="pill" id="start2">via 2º tempo</button>
    </div>

    <div id="compare">
      <input id="tv" inputmode="numeric" placeholder="mm:ss" autocomplete="off">
      <button class="pill" id="cmp">confronta</button>
    </div>

    <div id="verdict"></div>
    <button class="pill" id="apply" hidden></button>
  </section>

  <section id="tuner">
    <div id="row">
      <button class="nudge" id="minus">&minus;</button>
      <div id="amount">
        <div id="secs">–</div>
        <div class="label">secondi indietro</div>
      </div>
      <button class="nudge" id="plus">+</button>
    </div>
    <input type="range" id="slider" min="0" max="180" step="1" value="60">
  </section>

  <audio id="audio"></audio>
</main>

<script>
const audio   = document.getElementById('audio');
const btn     = document.getElementById('btn');
const slider  = document.getElementById('slider');
const secs    = document.getElementById('secs');
const stateEl = document.getElementById('state');
const clockEl = document.getElementById('clockValue');
const tvInput = document.getElementById('tv');
const verdict = document.getElementById('verdict');
const applyBtn = document.getElementById('apply');

let delay = null;      // secondi indietro rispetto al vivo
let ready = false;
let playing = false;
let retune = null;     // timer di rimbalzo
let nextMatch = null;

// Ancoraggio del cronometro: quando è stato premuto "via", con che ritardo,
// e da quale minuto di gioco parte (0 o 45).
let anchor = null;
let pendingTarget = null;
let liveClock = null;   // {seconds, receivedAt, status} dal feed

function mmss(s) {
  s = Math.max(0, Math.round(s));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' +
         String(s % 60).padStart(2, '0');
}

function clockText(s) {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

// Minuto di gioco dell'audio che sta suonando adesso.
// Se sposti il cursore l'audio salta, e il termine (delay - anchor.d0) lo recupera.
function matchClock() {
  if (!anchor || delay === null) return null;
  return (Date.now() / 1000 - anchor.t0) - (delay - anchor.d0) + anchor.base;
}

function parseTv(value) {
  const digits = (value || '').replace(/\D/g, '');
  if (!digits) return null;
  if (digits.length <= 2) return Number(digits) * 60;
  const s = Number(digits.slice(-2));
  if (s > 59) return null;
  return Number(digits.slice(0, -2)) * 60 + s;
}

// Orologio preso dal feed: il minuto arriva ogni tanto, i secondi li contiamo qui.
function liveNow() {
  if (!liveClock) return null;
  return liveClock.seconds + (Date.now() / 1000 - liveClock.receivedAt);
}

function isLive() { return liveClock !== null; }

function currentClock() {
  const l = liveNow();
  return l === null ? matchClock() : l;
}

function renderClock() {
  const t = currentClock();
  clockEl.textContent = t === null ? '–:––' : clockText(t);

  const live = isLive();
  document.getElementById('clockLabel').textContent =
    live ? 'tempo di gioco · in diretta' : 'tempo di gioco alla radio';
  document.getElementById('clockNote').textContent =
    live ? (liveClock.status ? 'dal feed · ' + liveClock.status : 'dal feed')
         : (anchor ? '' : 'partita non in corso — puoi avviarlo a mano');
  document.getElementById('anchors').hidden = live;
}

function setAnchor(base) {
  if (delay === null) return;
  anchor = { t0: Date.now() / 1000, d0: delay, base: base };
  verdict.textContent = '';
  applyBtn.hidden = true;
  pendingTarget = null;
  renderClock();
}

function compare() {
  const mine = currentClock();
  const theirs = parseTv(tvInput.value);

  if (mine === null) { verdict.textContent = 'prima avvia il cronometro'; return; }
  if (theirs === null) { verdict.textContent = 'scrivi il tempo della TV, es. 43:20'; return; }

  const gap = Math.round(mine - theirs);

  if (isLive()) {
    // Il cronometro è il tempo vero della partita: lo scarto è quanto è
    // indietro la TV, e diventa direttamente il ritardo da impostare.
    if (gap <= 0) {
      verdict.textContent = 'la TV non risulta indietro';
      applyBtn.hidden = true;
      pendingTarget = null;
      return;
    }
    pendingTarget = Math.min(gap, Number(slider.max));
    verdict.textContent = 'la TV è indietro di ' + gap + ' s';
    applyBtn.textContent = 'imposta ' + pendingTarget + ' s';
    applyBtn.hidden = false;
    return;
  }

  // Cronometro ancorato a mano: segna il minuto dell'audio, quindi lo scarto
  // è una correzione da sommare al ritardo attuale.
  if (gap === 0) {
    verdict.textContent = 'siete allineati';
    applyBtn.hidden = true;
    pendingTarget = null;
    return;
  }
  pendingTarget = Math.max(0, Math.min(delay + gap, Number(slider.max)));
  verdict.textContent = gap > 0
    ? 'la radio è avanti di ' + gap + ' s'
    : 'la radio è indietro di ' + (-gap) + ' s';
  applyBtn.textContent = 'porta a ' + pendingTarget + ' s';
  applyBtn.hidden = false;
}

function connect() {
  audio.src = '/stream?delay=' + delay + '&t=' + Date.now();
  audio.play().catch(() => {});
}

function setDelay(value) {
  delay = Math.max(0, Math.min(value, Number(slider.max)));
  slider.value = delay;
  secs.textContent = delay;
  if (playing) {
    clearTimeout(retune);
    retune = setTimeout(connect, 600);
  }
  renderClock();
  poll();
}

function renderMatch() {
  const el = document.getElementById('match');
  if (!nextMatch) { el.hidden = true; return; }

  const kickoff = new Date(nextMatch.kickoff_utc);
  const left = (kickoff - new Date()) / 1000;
  let when;

  if (left <= 0) {
    when = 'in corso';
  } else {
    const quando = kickoff.toLocaleString('it-IT', {
      weekday: 'long', day: 'numeric', month: 'long',
      hour: '2-digit', minute: '2-digit'
    });
    if (left < 3600) {
      when = quando + ' · tra ' + mmss(left);
    } else if (left < 86400) {
      when = quando + ' · tra ' + Math.floor(left / 3600) + 'h ' +
             Math.floor((left % 3600) / 60) + 'm';
    } else {
      const g = Math.round(left / 86400);
      when = quando + ' · tra ' + g + (g === 1 ? ' giorno' : ' giorni');
    }
  }

  el.textContent = nextMatch.home + ' – ' + nextMatch.away + '\n' + when;
  el.style.whiteSpace = 'pre-line';
  el.hidden = false;
}

async function poll() {
  try {
    const r = await fetch('/status?delay=' + (delay === null ? '' : delay),
                          { cache: 'no-store' });
    const s = await r.json();

    document.getElementById('station').textContent = s.station;
    document.title = s.station + ' in differita';
    nextMatch = s.next_match || null;
    renderMatch();

    liveClock = s.live_match
      ? { seconds: s.live_match.clock_seconds,
          receivedAt: Date.now() / 1000,
          status: s.live_match.status }
      : null;
    renderClock();
    slider.max = s.max_delay_seconds;

    if (delay === null) setDelay(s.default_delay_seconds);

    ready = s.ready;
    btn.disabled = !s.ready;
    document.getElementById('resync').hidden = !playing;

    if (!s.ready) {
      stateEl.textContent = 'in buffering, pronto tra ' + mmss(delay - s.buffer_seconds);
    } else if (!playing) {
      stateEl.textContent = s.upstream_connected ? 'pronto' : 'pronto (upstream giù)';
    } else {
      stateEl.textContent = s.upstream_connected ? 'in onda' : 'upstream giù';
    }
  } catch (e) {
    stateEl.textContent = 'server non raggiungibile';
    btn.disabled = true;
  }
}

btn.addEventListener('click', () => {
  if (playing) {
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    playing = false;
    btn.innerHTML = '&#9654;';
  } else if (ready) {
    playing = true;
    btn.innerHTML = '&#10073;&#10073;';
    connect();
  }
  poll();
});

// Riaggancia allo stesso ritardo: butta via il buffer accumulato dal browser.
document.getElementById('resync').addEventListener('click', () => {
  if (playing) connect();
});

document.getElementById('start1').addEventListener('click', () => setAnchor(0));
document.getElementById('start2').addEventListener('click', () => setAnchor(2700));
document.getElementById('cmp').addEventListener('click', compare);

applyBtn.addEventListener('click', () => {
  if (pendingTarget === null) return;
  setDelay(pendingTarget);
  verdict.textContent = 'allineato';
  applyBtn.hidden = true;
  pendingTarget = null;
});

slider.addEventListener('input', () => setDelay(Number(slider.value)));
document.getElementById('minus').addEventListener('click', () => setDelay(delay - 1));
document.getElementById('plus').addEventListener('click', () => setDelay(delay + 1));

poll();
setInterval(poll, 2000);
setInterval(renderMatch, 1000);
setInterval(renderClock, 250);
</script>
</body>
</html>
